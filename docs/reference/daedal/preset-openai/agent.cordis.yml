        toolFilter:
          allow: [mcp__agent_browser__agent_browser_open, mcp__agent_browser__agent_browser_read, mcp__agent_browser__agent_browser_snapshot, mcp__agent_browser__agent_browser_wait_ms, mcp__agent_browser__agent_browser_wait_for_selector, mcp__agent_browser__agent_browser_wait_for_text, mcp__agent_browser__agent_browser_wait_for_load, mcp__agent_browser__agent_browser_get_text, mcp__agent_browser__agent_browser_get_url, mcp__agent_browser__agent_browser_get_title, mcp__agent_browser__agent_browser_tab_list, mcp__agent_browser__agent_browser_click, mcp__agent_browser__agent_browser_fill, mcp__agent_browser__agent_browser_type, mcp__agent_browser__agent_browser_press, mcp__agent_browser__agent_browser_check, mcp__agent_browser__agent_browser_uncheck, mcp__agent_browser__agent_browser_select, mcp__agent_browser__agent_browser_scroll, mcp__agent_browser__agent_browser_close, mcp__agent_browser__agent_browser_back, mcp__agent_browser__agent_browser_forward, mcp__agent_browser__agent_browser_reload, mcp__agent_browser__agent_browser_tab_new, mcp__agent_browser__agent_browser_tab_switch, mcp__agent_browser__agent_browser_tab_close]
