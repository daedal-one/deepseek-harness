          allow: [mcp__chrome_devtools__get_console_message, mcp__chrome_devtools__list_console_messages, mcp__chrome_devtools__list_network_requests, mcp__chrome_devtools__list_pages, mcp__chrome_devtools__performance_analyze_insight, mcp__chrome_devtools__select_page, mcp__chrome_devtools__wait_for, mcp__chrome_devtools__get_network_request, mcp__chrome_devtools__new_page, mcp__chrome_devtools__navigate_page, mcp__chrome_devtools__take_snapshot, mcp__chrome_devtools__performance_start_trace, mcp__chrome_devtools__performance_stop_trace, mcp__chrome_devtools__lighthouse_audit]
        maxDepth: 3
        principal: daedal-web-debugger

