      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: memory_reviewer
        agentLabel: Daedal OpenAI memory reviewer
        agentModelId: daedal-openai-memory-reviewer
        backgroundMode: one-shot
        agentOptions:
          provider: openai-codex
          model: gpt-5.6-sol
          reasoningEffort: xhigh
          maxTokens: 65536
        persona: !!js "((text) => text.slice(text.indexOf('\\n---\\n', 4) + 5).trim())(process.getBuiltinModule('node:fs').readFileSync(new URL('roles/memory-reviewer.md', baseUrl), 'utf8'))"
        toolFilter:
