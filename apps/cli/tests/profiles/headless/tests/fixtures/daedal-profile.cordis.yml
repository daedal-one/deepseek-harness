- id: agent-default-model
  config:
    provider: cli-mock
    model: cli-mock

- id: agent-presets
  config:
    default: daedal

- insert:
    - id: cli-mock-llm
      name: './snapshot-fixtures/cli-mock-llm.ts'

    - id: snapshot-approval-allow-once
      name: './snapshot-fixtures/approval-allow-once.ts'

    - id: daedal-snapshot-tool-policy
      name: '@deepseek-ai/dsh-tool-policy'
      config:
        providers: [shell]

    - id: daedal-snapshot-tool-policy-shell
      name: '@deepseek-ai/dsh-tool-policy-shell'
      config:
        id: shell
        mappings:
          - tool: bash
            commandArgument: command
            intentArgument: description
        intent: { provider: cli-mock-intent, model: cli-mock }
        primary: { provider: cli-mock-primary, model: cli-mock }
        secondary: { provider: cli-mock-secondary, model: cli-mock }
        timeoutMs: 1000
        maxTokens: 128
        maxCommandChars: 1000
        maxUserMessageChars: 1000
        maxIntentChars: 200
        maxOutputChars: 1000
        maxSummaryChars: 120
        maxReasonChars: 120
        maxEffects: 8
        rules: []

    - id: daedal-snapshot-tool-policy-enforcer
      name: '@deepseek-ai/dsh-tool-policy-enforcer'

    - id: daedal-snapshot-memory
      name: '@deepseek-ai/dsh-memory'

    - id: daedal-snapshot-memory-sqlite
      name: '@deepseek-ai/dsh-memory-sqlite'
      config:
        path: !!js dshHomePath('snapshot-memory/daedal.sqlite')
        retentionDays: 7
        maxSearchResults: 10
