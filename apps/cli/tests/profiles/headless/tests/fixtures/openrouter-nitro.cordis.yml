- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-pi-ai
        config:
          providers:
            openrouter:
              apiKeyEnv: OPENROUTER_API_KEY
              baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
              streamIdleTimeoutMs: 150
              modelAliases:
                deepseek/deepseek-v4-flash-0731:nitro:
                  catalogModel: deepseek/deepseek-v4-flash
                  name: DeepSeek V4 Flash 0731 (Nitro)
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: openrouter
              model: deepseek/deepseek-v4-flash-0731:nitro
              reasoningEffort: xhigh
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless OpenRouter Nitro reasoning snapshot.'
      - id: persistence
        config:
          root: './.sessions'
