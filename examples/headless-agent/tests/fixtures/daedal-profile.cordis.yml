- id: agent-default-model
  config:
    provider: cli-mock
    model: cli-mock

- id: agent-presets
  config:
    default: daedal

- id: permission
  config:
    defaultPreset: policy-reviewed
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      policy-reviewed:
        sandbox: danger-full-access
        approval: ask
        name: Policy reviewed
        description: Independently reviews supported shell and MCP calls; uncertain actions ask you.
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- insert:
    - id: cli-mock-llm
      name: './snapshot-fixtures/cli-mock-llm.ts'

    - id: snapshot-approval-allow-once
      name: './snapshot-fixtures/approval-allow-once.ts'

    - id: daedal-snapshot-tool-policy
      name: '@deepseek-ai/dsh-tool-policy'
      config:
        providers: [shell]

    - id: daedal-snapshot-tool-policy-shell
      name: '@deepseek-ai/dsh-tool-policy-shell'
      config:
        id: shell
        mappings:
          - tool: bash
            commandArgument: command
            intentArgument: description
        intent: { provider: cli-mock-intent, model: cli-mock, reasoningEffort: minimal }
        primary: { provider: cli-mock-intent, model: cli-mock, reasoningEffort: minimal }
        secondary: { provider: cli-mock-secondary, model: cli-mock }
        decisionTimeoutMs: 2000
        intentContextTimeoutMs: 5000
        maxTokens: 80
        maxCommandChars: 1000
        maxUserMessageChars: 1000
        maxIntentChars: 200
        maxOutputChars: 1000
        maxSummaryChars: 120
        maxEffects: 8
        rules: []

    - id: daedal-snapshot-tool-policy-enforcer
      name: '@deepseek-ai/dsh-tool-policy-enforcer'
      config:
        enforceWhen:
          sandboxModes: [danger-full-access]
          approvalPolicies: [ask]

    - id: daedal-snapshot-memory
      name: '@deepseek-ai/dsh-memory'

    - id: daedal-snapshot-memory-sqlite
      name: '@deepseek-ai/dsh-memory-sqlite'
      config:
        path: !!js dshHomePath('snapshot-memory/daedal.sqlite')
        retentionDays: 7
        maxSearchResults: 10
