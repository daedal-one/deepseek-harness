# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-pwsh-local'

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: !!js "process.env.DSH_SNAPSHOT === 'replay' ? 'deepseek-official' : 'openrouter'"
    model: !!js "process.env.DSH_SNAPSHOT === 'replay' ? 'deepseek-v4-pro' : 'deepseek/deepseek-v4-flash-0731:nitro'"
    persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    # job_output/job_kill stay mounted (the bundle's toolJobs default) so
    # background pwsh runs are readable and killable.
    goals: false
    # The pwsh tool replaces the bundle's bash tool in this composition.
    toolBash: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
