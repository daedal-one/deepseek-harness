# Session-title snapshot composition: the optional first-prompt provider uses
# the ordinary DeepSeek route while the ACP app and every other capability stay
# identical to the base example.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: session-title-provider
            name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
            config:
              targetWords: 5
              targetCjkCharacters: 10
              maxInputBytes: 4096
              maxOutputTokens: 32
              timeoutMs: 5000
              provider: !!js 'process.env.DSH_SNAPSHOT === "replay" ? "deepseek-official" : "openrouter"'
              model: !!js 'process.env.DSH_SNAPSHOT === "replay" ? "deepseek-v4-flash" : "deepseek/deepseek-v4-flash-0731:nitro"'
