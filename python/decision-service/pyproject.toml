[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-local-decision-service"
version = "0.1.0"
description = "Private offline CPU Kev decision bridge for DeepSeek Harness"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
dsh-decision-service = "dsh_decision_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
