# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-flash
              - id: deepseek-v4-pro

- id: tools
  config:
    mode: native

- insert:
    - id: snapshot-tool-policy
      name: '@deepseek-ai/dsh-tool-policy'
    - id: snapshot-shell-policy
      name: '@deepseek-ai/dsh-tool-policy-shell'
      config:
        id: snapshot-shell
        mappings: [{ tool: bash, commandArgument: command, commandSyntax: posix }]
        intent: { provider: unavailable-intent, model: intent-reviewer }
        primary: { provider: unavailable-primary, model: effect-reviewer }
        secondary: { provider: unavailable-secondary, model: effect-reviewer }
        decisionTimeoutMs: 1000
        intentContextTimeoutMs: 1000
        maxTokens: 80
        maxCommandChars: 4096
        maxUserMessageChars: 1024
        maxIntentChars: 256
        maxOutputChars: 1024
        maxSummaryChars: 256
        maxEffects: 8
        rules: []
        prefixRules:
          - pattern: [printf, '%s', APPROVAL_ONCE]
            decision: ask
            reason: This action requires explicit user approval.
            match: ["printf '%s' APPROVAL_ONCE"]
    - id: snapshot-policy-enforcer
      name: '@deepseek-ai/dsh-tool-policy-enforcer'
- insert:
    - id: snapshot-approval-answerer
      name: '../../../apps/cli/tests/profiles/headless/tests/fixtures/approval-allow-once.ts'
